# ============================================================
# Publish Workflow — Build + Push Docker image в GHCR
# ============================================================
#
# Запускается при:
#   - Push в main (после мержа PR)
#   - Push тега v*.*.* (релиз)
#
# Что делает:
#   1) Логинится в GitHub Container Registry (ghcr.io)
#   2) Генерирует теги: latest, sha-<short>, semver (для тегов)
#   3) Собирает Docker image и пушит в ghcr.io
#
# Результат:
#   Image доступен для pull:
#     docker pull ghcr.io/<owner>/<repo>:latest
#     docker pull ghcr.io/<owner>/<repo>:sha-abc1234
#     docker pull ghcr.io/<owner>/<repo>:1.0.0 (при tag v1.0.0)
#
# Права:
#   Использует GITHUB_TOKEN (встроенный, без PAT).
#   Для public repo — работает из коробки.
#   Для private repo — см. docs/runner-setup-windows.md.

name: Publish to GHCR

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

# Права для GITHUB_TOKEN
permissions:
  contents: read
  packages: write

# Один билд за раз на одну ветку/тег
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Имя image в GHCR (lowercase обязателен!)
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: "Build & Push to GHCR"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐳 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 Login to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN автоматически создаётся GitHub для каждого workflow run.
          # Имеет права packages:write благодаря permissions выше.

      - name: "🏷️ Generate Docker metadata (tags + labels)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # На push в main → тег "latest"
            type=raw,value=latest,enable={{is_default_branch}}
            # Всегда → тег "sha-<short hash>"
            type=sha,prefix=sha-,format=short
            # На push тега v1.2.3 → теги "1.2.3", "1.2", "1"
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # metadata-action также добавляет OCI-стандартные labels
          # (org.opencontainers.image.source и т.д.)

      - name: "🏗️ Build and push Docker image"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "📋 Summary"
        run: |
          echo "### 🐳 Image pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
