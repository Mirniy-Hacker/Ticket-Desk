# ============================================================
# CI Workflow — проверка качества кода на Pull Request
# ============================================================
#
# Запускается при:
#   - Открытии/обновлении PR в ветку main
#
# Что делает:
#   1) node-ci: lint → typecheck → test → build
#   2) docker-build: проверяет что Dockerfile собирается без ошибок
#
# Если ЛЮБОЙ шаг упадёт — PR получит красный крестик в GitHub,
# и мержить нельзя (если настроен branch protection).

name: CI

on:
  pull_request:
    branches: [main]

# Отменять предыдущий запуск CI если PR обновился
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Node.js CI — lint, typecheck, test, build
  # ──────────────────────────────────────────────────────────
  node-ci:
    name: "Node.js CI"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          # Кеширование node_modules по lock-файлу
          cache: "npm"

      - name: "📦 Install dependencies"
        run: npm ci
        # npm ci (не npm install!) — строго по lock-файлу.
        # Гарантирует одинаковые зависимости у всех разработчиков и в CI.

      - name: "🔍 Lint"
        run: npm run lint
        # ESLint проверяет стиль кода и типовые ошибки.
        # Настройки: eslint.config.mjs

      - name: "🔷 Type check"
        run: npm run typecheck
        # tsc --noEmit — проверяет типы БЕЗ генерации кода.
        # Ловит ошибки, которые ESLint не видит.

      - name: "🧪 Run tests"
        run: npm test
        # vitest run — запускает unit-тесты (store CRUD операции).

      - name: "🏗️ Build"
        run: npm run build
        # next build — собирает production-билд.
        # Проверяет что все страницы рендерятся без ошибок.

  # ──────────────────────────────────────────────────────────
  # Job 2: Docker Build — проверка Dockerfile
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: "Docker Build Check"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐳 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
        # Buildx — расширенный билдер Docker.
        # Поддерживает кеширование слоёв, multi-platform builds.

      - name: "🏗️ Build Docker image (no push)"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Кеш слоёв в GitHub Actions cache — ускоряет повторные сборки
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ticketdesk:ci-test
