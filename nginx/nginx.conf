# ============================================================
# NGINX Configuration — Reverse Proxy для Next.js
# ============================================================
#
# Этот файл монтируется в контейнер nginx как:
#   /etc/nginx/conf.d/default.conf
#
# Что делает nginx в этом проекте:
#  1. Принимает ВСЕ HTTP-запросы от клиента (порт 80 в контейнере)
#  2. Проксирует их на Next.js (порт 3000 в контейнере next-app)
#  3. Добавляет gzip-сжатие (экономит трафик)
#  4. Кеширует статику /_next/static (immutable, 1 год)
#  5. Добавляет security-заголовки
#  6. Логирует всё в stdout/stderr (для docker logs)
#
# Подробнее: docs/nginx-explained.md

# ─── Upstream: пул бэкенд-серверов ──────────────────────────
# В нашем случае один сервер, но upstream даёт keepalive.
upstream nextapp {
    server next-app:3000;
    # keepalive — переиспользуем TCP-соединения к бэкенду.
    # Без этого nginx создаёт новое соединение на каждый запрос (медленно).
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ─── Security Headers ────────────────────────────────────
    # Защита от типовых атак. Подробнее: docs/nginx-explained.md
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Gzip Compression ───────────────────────────────────
    # Сжимаем текстовые ресурсы. Экономия трафика ~60-80%.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ─── Static Assets: /_next/static ────────────────────────
    # Файлы имеют content-hash в имени (main-abc123.js).
    # Поэтому безопасно кешировать на год с immutable:
    # браузер НИКОГДА не будет перепроверять этот файл.
    location /_next/static {
        proxy_pass http://nextapp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Перезаписываем Cache-Control для статики
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Дублируем security headers (add_header в location переопределяет server-level)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ─── All Other Requests → Next.js ────────────────────────
    location / {
        proxy_pass http://nextapp;
        proxy_http_version 1.1;

        # WebSocket support (для HMR в dev, и для будущего функционала)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Передаём реальный IP клиента (без этого Next.js видит IP nginx)
        # $http_host включает порт (localhost:8080), а не просто $host (localhost).
        # Это КРИТИЧНО для Server Actions: Next.js сверяет Host с Origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # proxy_buffering off — КРИТИЧНО для SSR/RSC streaming.
        # С включённым буферированием nginx ждёт ВЕСЬ ответ от Next.js,
        # и только потом отправляет клиенту. Это убивает streaming.
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── Access & Error Logs ─────────────────────────────────
    # stdout/stderr — стандарт для Docker (docker compose logs).
    # Nginx alpine image уже создаёт симлинки на /dev/stdout и /dev/stderr.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
